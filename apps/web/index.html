<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ede1" />
    <meta
      name="description"
      content="Học từ vựng tiếng Anh & tiếng Trung ngoại tuyến: bài học, trò chơi ôn tập, từ điển 207k từ."
    />
    <script>
      // Đặt theme sớm để không nhấp nháy (FOUC) — el_theme hoặc prefers-color-scheme
      (function () {
        try {
          var t = localStorage.getItem('el_theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Học Từ Vựng — Tiếng Anh & Tiếng Trung</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
