<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Từ Vựng Của Tôi</title>
<style>
  :root{
    --bg:#f3f5f7;
    --panel:#ffffff;
    --border:#e4e8ee;
    --border-strong:#cfd6df;
    --text:#1c2430;
    --muted:#667085;
    --primary:#16a34a;
    --primary-dark:#15803d;
    --primary-soft:#e8f6ee;
    --amber:#d97706;
    --amber-soft:#fdf4e3;
    --danger:#dc2626;
    --danger-soft:#fdecec;
    --new:#98a2b3;
    --learning:#d97706;
    --mastered:#16a34a;
    --radius:16px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
    --shadow-lg:0 10px 30px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
  }
  .header-inner{
    max-width:980px;margin:0 auto;
    display:flex;align-items:center;gap:14px;
  }
  .logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .logo-icon{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg,#22c55e,#15803d);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:#fff;box-shadow:var(--shadow);
  }
  .logo-name{font-size:15px;font-weight:700;line-height:1.2;}
  .logo-name small{display:block;font-size:11px;color:var(--muted);font-weight:500;}
  nav{
    display:flex;gap:2px;background:var(--bg);
    padding:4px;border-radius:12px;border:1px solid var(--border);
    margin-left:auto;
  }
  nav button{
    border:none;background:transparent;padding:8px 13px;border-radius:9px;
    cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:600;
    transition:all .15s;white-space:nowrap;
  }
  nav button:hover{color:var(--text);background:#fff;}
  nav button.active{background:var(--text);color:#fff;box-shadow:var(--shadow);}
  .streak-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--amber-soft);color:var(--amber);
    border:1px solid #f5dcae;padding:6px 12px;border-radius:999px;
    font-size:13px;font-weight:700;flex-shrink:0;
  }
  main{max-width:980px;margin:0 auto;padding:22px 16px 40px;}
  .panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px;margin-bottom:16px;
  }
  h2{font-size:17px;margin:0 0 12px;font-weight:700;}
  h3{font-size:12px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .muted{color:var(--muted);}
  .empty-state{text-align:center;padding:38px 20px;color:var(--muted);}
  .empty-state .big{font-size:40px;margin-bottom:8px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--primary);background:var(--primary);color:#fff;
    padding:10px 18px;border-radius:12px;cursor:pointer;
    font-size:14px;font-weight:600;font-family:inherit;
    transition:all .15s;text-decoration:none;
  }
  .btn:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:var(--shadow);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.ghost{background:#fff;color:var(--text);border-color:var(--border-strong);}
  .btn.ghost:hover{background:var(--bg);}
  .btn.soft{background:var(--primary-soft);color:var(--primary-dark);border-color:#cfe9da;}
  .btn.soft:hover{background:#d8f0e3;}
  .btn.danger{background:#fff;color:var(--danger);border-color:#f3c1c1;}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px;}
  .btn-lg{width:100%;padding:13px;font-size:15px;}
  .icon-btn{
    border:none;background:transparent;cursor:pointer;color:var(--muted);
    font-size:14px;padding:6px 9px;border-radius:9px;transition:all .15s;
  }
  .icon-btn:hover{background:var(--bg);color:var(--text);}
  .speak-btn{
    border:none;background:var(--primary-soft);color:var(--primary-dark);
    width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;
    transition:all .15s;flex-shrink:0;
  }
  .speak-btn:hover{background:#d5eedd;transform:scale(1.08);}
  label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 5px;}
  input[type=text],input[type=search],textarea,select{
    width:100%;padding:10px 13px;border:1px solid var(--border-strong);
    border-radius:11px;font-size:14.5px;font-family:inherit;
    background:#fff;color:var(--text);transition:border .15s;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  textarea{resize:vertical;min-height:56px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row > .grow{flex:1;min-width:140px;}
  small.help{display:block;color:var(--muted);font-size:12px;margin-top:4px;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700;
  }
  .badge.new{background:#eceff3;color:#5b6573;}
  .badge.learning{background:var(--amber-soft);color:var(--learning);}
  .badge.mastered{background:var(--primary-soft);color:var(--primary-dark);}
  .pos-chip{
    display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;
    background:#eef1f6;color:#45536b;padding:3px 10px;border-radius:8px;
  }
  .ipa-chip{
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:13px;color:var(--muted);background:var(--bg);
    padding:3px 10px;border-radius:8px;border:1px solid var(--border);
  }
  .tag{
    display:inline-flex;align-items:center;font-size:12px;
    padding:4px 11px;border-radius:999px;background:#eef3fa;color:#35618f;
    font-weight:600;
  }
  .syn-chip{background:var(--primary-soft);color:var(--primary-dark);}
  .ant-chip{background:var(--danger-soft);color:var(--danger);}
  .word-list{list-style:none;margin:0;padding:0;}
  .word-item{
    display:flex;align-items:center;gap:12px;
    padding:13px 14px;border-radius:12px;cursor:pointer;
    transition:background .12s;
  }
  .word-item:hover{background:#f8fafc;}
  .word-item + .word-item{border-top:1px solid var(--border);}
  .word-item .w{font-weight:700;font-size:16px;}
  .word-item .meta{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .chev{color:#c2cad4;font-size:14px;margin-left:auto;flex-shrink:0;}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .status-dot.new{background:var(--new);}
  .status-dot.learning{background:var(--learning);}
  .status-dot.mastered{background:var(--mastered);}
  .hero{
    background:linear-gradient(135deg,#14532d,#16a34a 60%,#4ade80);
    color:#fff;border-radius:20px;padding:24px;margin-bottom:16px;
    box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    border-radius:50%;background:rgba(255,255,255,.12);
  }
  .hero h2{margin:0;font-size:22px;font-weight:800;}
  .hero p{margin:6px 0 0;opacity:.9;font-size:14px;}
  .hero .row{margin-top:14px;position:relative;z-index:1;}
  .hero .stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
    padding:8px 14px;border-radius:12px;font-size:13px;font-weight:600;backdrop-filter:blur(4px);}
  .progress-track{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:14px;position:relative;z-index:1;}
  .progress-fill{height:100%;background:#fff;border-radius:99px;transition:width .4s ease;}
  .learn-card{border:1px solid var(--border);border-radius:18px;padding:22px;background:#fff;}
  .learn-word-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .learn-word{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.1;}
  .def-line{border-left:3px solid var(--primary);padding:2px 0 2px 12px;margin:14px 0;}
  .def-line .en{font-size:14.5px;color:var(--text);}
  .def-line .vi{font-size:15.5px;font-weight:600;margin-top:4px;}
  .example-box{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;}
  .example-box .q{color:var(--primary);font-weight:700;}
  .collapse-btn{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--border-strong);background:#fff;color:var(--text);
    padding:7px 13px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:600;
    transition:all .15s;
  }
  .collapse-btn:hover{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-soft);}
  .collapse-btn .cnt{background:var(--bg);color:var(--muted);border-radius:99px;padding:0 7px;font-size:11px;}
  .collapse-body{display:none;margin-top:10px;padding:12px;background:#f8fafc;border:1px solid var(--border);border-radius:12px;animation:fadeIn .2s;}
  .collapse-body.open{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .detail-word{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1;}
  .section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px;}
  .section-title .bar{width:4px;height:14px;background:var(--primary);border-radius:99px;}
  .kv{display:flex;gap:10px;align-items:baseline;font-size:14.5px;}
  .kv .k{color:var(--muted);font-weight:600;min-width:110px;flex-shrink:0;}
  .game-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;}
  .game-card{
    border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;
    background:#fff;text-align:left;transition:all .15s;box-shadow:var(--shadow);
    font-family:inherit;
  }
  .game-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .game-card .gi{font-size:28px;}
  .game-card h3{margin:10px 0 4px;color:var(--text);text-transform:none;font-size:15.5px;letter-spacing:0;font-weight:700;}
  .game-card p{margin:0;font-size:12.5px;color:var(--muted);}
  .game-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .game-progress{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin:12px 0;}
  .game-progress .fill{height:100%;background:var(--primary);border-radius:99px;transition:width .3s;}
  .flashcard-wrap{perspective:1200px;}
  .flashcard{
    position:relative;width:100%;min-height:250px;cursor:pointer;
    transform-style:preserve-3d;transition:transform .5s ease;
  }
  .flashcard.flipped{transform:rotateY(180deg);}
  .flashcard .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:1px solid var(--border);border-radius:20px;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px 20px;box-shadow:var(--shadow);
  }
  .flashcard .back{transform:rotateY(180deg);}
  .fc-word{font-size:30px;font-weight:800;}
  .fc-ipa{font-size:14px;color:var(--muted);margin-top:6px;}
  .fc-hint{font-size:12px;color:#a6b0bf;margin-top:18px;}
  .fc-vi{font-size:20px;font-weight:700;color:var(--primary-dark);}
  .fc-en{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:420px;}
  .choice-btn{
    display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:9px;
    border:1px solid var(--border-strong);border-radius:12px;background:#fff;
    cursor:pointer;font-size:15px;font-family:inherit;font-weight:600;
    transition:all .12s;
  }
  .choice-btn:hover{border-color:var(--primary);background:var(--primary-soft);}
  .choice-btn.correct{border-color:var(--mastered);background:var(--primary-soft);}
  .choice-btn.wrong{border-color:var(--danger);background:var(--danger-soft);}
  .choice-btn:disabled{cursor:default;}
  .feedback{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;}
  .feedback.ok{background:var(--primary-soft);color:var(--primary-dark);}
  .feedback.no{background:var(--danger-soft);color:var(--danger);}
  .guess-word{font-size:30px;font-weight:800;letter-spacing:3px;font-family:"SF Mono",ui-monospace,Consolas,monospace;word-break:break-all;}
  .prompt-card{background:linear-gradient(135deg,#f8fafc,#eef6f1);border:1px solid var(--border);border-radius:16px;padding:18px;text-align:center;}
  .prompt-card .p-vi{font-size:17px;font-weight:700;}
  .prompt-card .p-en{font-size:15px;color:var(--muted);}
  .result-card{border:1px solid var(--border);border-radius:16px;padding:18px;background:#fff;margin-top:12px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin-bottom:14px;}
  .stat-box{border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;background:#fff;}
  .stat-box .num{font-size:24px;font-weight:800;line-height:1.1;}
  .stat-box .lbl{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px;}
  .bar-row .lbl{width:88px;color:var(--muted);flex-shrink:0;font-weight:600;}
  .bar-track{flex:1;background:#eef0f3;border-radius:99px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;transition:width .4s;}
  .bar-row .val{width:38px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
  .status-stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:8px 0 4px;}
  .status-stack div{height:100%;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;}
  .modal-bg{
    position:fixed;inset:0;background:rgba(15,23,42,.45);
    display:flex;align-items:flex-start;justify-content:center;
    padding:26px 16px;overflow-y:auto;z-index:60;animation:fadeIn .15s;
  }
  .modal{
    background:#fff;border-radius:18px;padding:22px;max-width:580px;width:100%;
    box-shadow:var(--shadow-lg);animation:slideUp .2s;
  }
  @keyframes slideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .close-x{cursor:pointer;font-size:22px;background:none;border:none;color:var(--muted);line-height:1;}
  .close-x:hover{color:var(--text);}
  .sense-block{border:1px solid var(--border);border-radius:13px;padding:13px;margin-top:12px;background:#fbfcfd;}
  .sense-block .sense-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .divider{height:1px;background:var(--border);margin:18px 0;}
  footer{text-align:center;color:#9aa5b1;font-size:12px;padding:0 16px 36px;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
    background:#111827;color:#fff;padding:11px 20px;border-radius:12px;font-size:13.5px;
    box-shadow:var(--shadow-lg);z-index:80;opacity:0;transition:all .25s;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (max-width:640px){
    .header-inner{flex-wrap:wrap;}
    nav{margin-left:0;order:3;width:100%;justify-content:space-between;}
    nav button{flex:1;padding:8px 6px;font-size:12.5px;}
    .learn-word{font-size:26px;}
    .detail-word{font-size:30px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">📘</div>
      <div class="logo-name">Từ Vựng Của Tôi<small>học tiếng Anh mỗi ngày</small></div>
    </div>
    <nav id="mainNav">
      <button data-tab="home">Hôm nay</button>
      <button data-tab="vocab">Từ vựng</button>
      <button data-tab="games">Ôn tập</button>
      <button data-tab="stats">Thống kê</button>
    </nav>
    <div class="streak-chip" title="Số ngày học liên tiếp">🔥 <span id="streakNum">0</span></div>
  </div>
</header>

<main id="app"></main>

<footer>Dữ liệu lưu trong trình duyệt (localStorage). Mẹo: bấm 🔈 để nghe phát âm từ.</footer>
<div class="toast" id="toastEl"></div>

<script>
/* ==================== STORAGE ==================== */
const KEY = 'vocab_entries_v2';
const KEY_DAILY = 'vocab_daily_v2';
const KEY_HIST = 'vocab_history_v2';
const DAILY_QUOTA = 8;

const $ = s => document.querySelector(s);
const app = document.getElementById('app');

function loadEntries(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function saveEntries(list){ localStorage.setItem(KEY, JSON.stringify(list)); }
function loadDaily(){ try{ return JSON.parse(localStorage.getItem(KEY_DAILY)) || {}; }catch(e){ return {}; } }
function saveDaily(o){ localStorage.setItem(KEY_DAILY, JSON.stringify(o)); }
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(KEY_HIST)) || []; }catch(e){ return []; } }
function saveHistory(list){ localStorage.setItem(KEY_HIST, JSON.stringify(list.slice(-800))); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return 'w_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(str){
  return String(str||'').toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[.,!?;:'"()\-–—]/g,'').replace(/\s+/g,' ');
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function toast(msg){
  const t = document.getElementById('toastEl');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ==================== TTS ==================== */
function speak(text, lang){
  if(!('speechSynthesis' in window)){ toast('Trình duyệt không hỗ trợ phát âm'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  u.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang.replace('_','-').toLowerCase().startsWith((lang||'en-US').toLowerCase()));
  if(v) u.voice = v;
  window.speechSynthesis.speak(u);
}

/* ==================== STATE ==================== */
let state = {
  entries: loadEntries(),
  tab: 'home',
  vocabFilter: { search:'', status:'all', tag:'all' },
  detailId: null,
  gameScreen: 'menu',
};
let modalDraft = null;
let session = null;

/* ==================== LEARNING LOGIC ==================== */
function markLearned(entry){
  const changed = entry.learningStatus === 'new';
  if(changed) entry.learningStatus = 'learning';
  entry.lastReviewDay = todayStr();
  const daily = loadDaily();
  const t = todayStr();
  daily[t] = daily[t] || [];
  if(!daily[t].includes(entry.id)) daily[t].push(entry.id);
  saveDaily(daily);
  saveEntries(state.entries);
  return changed;
}
function registerResult(entry, wasCorrect){
  entry.correctStreak = entry.correctStreak || 0;
  if(wasCorrect){
    entry.correctStreak += 1;
    if(entry.learningStatus==='new'){ markLearned(entry); }
    else { entry.lastReviewDay = todayStr(); }
  } else {
    entry.correctStreak = 0;
    if(entry.learningStatus==='mastered') entry.learningStatus = 'learning';
    entry.lastReviewDay = todayStr();
  }
  if(entry.correctStreak >= 3 && entry.learningStatus !== 'mastered'){
    entry.learningStatus = 'mastered';
    toast('🎉 Đã thuộc: "'+entry.word+'"!');
  }
  saveEntries(state.entries);
}
function recordHistory(gameType, wordId, wasCorrect){
  const h = loadHistory();
  h.push({ ts:new Date().toISOString(), game:gameType, wordId, correct:wasCorrect });
  saveHistory(h);
}
function getStreak(){
  const daily = loadDaily();
  const cursor = new Date(todayStr());
  if(!(daily[fmtDate(cursor)]||[]).length) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(daily[fmtDate(cursor)] && daily[fmtDate(cursor)].length>0){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function learnedToday(){
  const daily = loadDaily();
  return daily[todayStr()] || [];
}
function statusLabel(s){ return s==='new' ? 'Mới' : s==='learning' ? 'Đang học' : 'Đã thuộc'; }

});
function render(){
  document.querySelectorAll('#mainNav button').forEach(b=> b.classList.toggle('active', b.dataset.tab===state.tab));

}

/* ==================== HOME / DAILY LEARNING ==================== */

  const current = newWords[0] || null;
  const streak = getStreak();

  } else if(newWords.length===0 && learned.length>0){
    body += `
      <div class="panel">
        <div class="empty-state">

          <h2 style="margin:0 0 6px;">Hết từ mới cho hôm nay!</h2>

          </div>
        </div>
      </div>`;
  } else {
    body += `
      <div class="panel">
        <div class="empty-state">
          <div class="big">🌱</div>
          <h2 style="margin:0 0 6px;">Bắt đầu ngay hôm nay</h2>
          <p>Bấm nút bên dưới để xem từ mới đầu tiên.</p>
          <div class="row" style="justify-content:center;margin-top:14px;">

            <button class="btn ghost" id="addMoreHomeBtn">＋ Thêm từ mới</button>
          </div>
        </div>
      </div>`;
  }

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h2 style="margin:0;">Ôn tập nhanh hôm nay</h2>
        ${due.length>0 ? `<button class="btn sm ghost" id="reviewAllBtn">Ôn tất cả (${due.length})</button>` : ''}
      </div>
      ${dueShow.length===0
        ? `<div class="empty-state" style="padding:20px;"><div class="big">✅</div>Hôm nay bạn đã ôn xong các từ đã học. Học từ mới lên nào!</div>`
        : `<ul class="word-list">${dueShow.map(e=>`
          <li class="word-item" data-id="${e.id}">

function rotateNewQueue(id){
  const learned = learnedToday();
  const newWords = state.entries.filter(e=> e.learningStatus==='new' && !learned.includes(e.id));
  const idx = newWords.findIndex(x=>x.id===id);
  if(idx<0) return;
  newWords.push(newWords.splice(idx,1)[0]);
  const order = newWords.map(x=>x.id);
  sessionStorage.setItem('newQ', JSON.stringify(order));
}

function toggleCollapse(btn){
  const key = btn.dataset.toggle;
  const root = btn.closest('.learn-card, .panel') || document;
  const body = root.querySelector('[data-body="'+key+'"]');
  if(!body) return;
  const open = body.classList.toggle('open');
  btn.style.borderColor = open ? 'var(--primary)' : '';
  btn.style.color = open ? 'var(--primary-dark)' : '';
  btn.style.background = open ? 'var(--primary-soft)' : '';
}
function posChips(e){
  const pos = Array.from(new Set((e.senses||[]).map(s=>s.partOfSpeech).filter(Boolean)));
  return pos.map(p=>`<span class="pos-chip">${escapeHtml(p)}</span>`).join('');

/* ==================== MODAL ADD/EDIT ==================== */
function openModal(id){
  if(id==='new'){
    modalDraft = { id:uid(), word:'', tags:[], dateAdded:new Date().toISOString(),
      learningStatus:'new', correctStreak:0, wordRoot:'', synonyms:[], antonyms:[],
      senses:[{pronunciation:'', partOfSpeech:'noun', definitionEN:'', definitionVI:'', examples:[]}] };
  } else {
    const found = state.entries.find(e=>e.id===id);
    modalDraft = JSON.parse(JSON.stringify(found));
  }
  renderModal();
}

function splitList(str){ return str.split(',').map(s=>s.trim()).filter(Boolean); }
function renderSenses(){

            ${['noun','verb','adjective','adverb','pronoun','preposition','conjunction','interjection','other'].map(p=>`<option value="${p}" ${s.partOfSpeech===p?'selected':''}>${p}</option>`).join('')}

  container.querySelectorAll('.sense-pron').forEach(el=> el.oninput = e=> d.senses[+e.target.dataset.idx].pronunciation = e.target.value);
  container.querySelectorAll('.sense-pos').forEach(el=> el.onchange = e=> d.senses[+e.target.dataset.idx].partOfSpeech = e.target.value);

async function doLookup(){
  const d = modalDraft;
  const statusEl = $('#lookupStatus');
  if(!d.word.trim()){ statusEl.textContent='Nhập từ tiếng Anh trước đã.'; statusEl.style.color='var(--danger)'; return; }
  statusEl.textContent='Đang tra cứu…'; statusEl.style.color='var(--muted)';
  try{
    const r = await fetchFromDictionaryApi(d.word);
    const oldVi = d.senses.map(s=>s.definitionVI);
    d.senses = r.senses.map((s,i)=>({...s, definitionVI: oldVi[i]||''}));
    d.synonyms = Array.from(new Set([...(d.synonyms||[]), ...r.synonyms]));
    d.antonyms = Array.from(new Set([...(d.antonyms||[]), ...r.antonyms]));
    renderSenses();
    statusEl.textContent='✓ Đã tự điền. Bổ sung nghĩa tiếng Việt nhé.';
    statusEl.style.color='var(--primary-dark)';
  }catch(err){
    statusEl.textContent='✗ '+err.message+' Bạn có thể nhập tay.';
    statusEl.style.color='var(--danger)';
  }
}
function saveWordFromModal(){
  const d = modalDraft;
  if(!d.word.trim()){ toast('Vui lòng nhập từ tiếng Anh'); return; }
  for(const s of d.senses){
    if(!s.definitionEN.trim() || !s.definitionVI.trim()){
      if(!confirm('Có nghĩa chưa điền đầy đủ định nghĩa. Vẫn lưu?')) return;
      break;
    }
  }
  const idx = state.entries.findIndex(e=>e.id===d.id);
  if(idx>=0) state.entries[idx] = d;
  else state.entries.push(d);
  saveEntries(state.entries);
  closeModal();
  if(state.tab==='vocab' && state.detailId) renderDetail(d.id);
  else render();
}
async function fetchFromDictionaryApi(word){
  const url = 'https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.trim().toLowerCase());
  const res = await fetch(url);
  if(!res.ok) throw new Error('Không tìm thấy từ trong từ điển (API).');
  const data = await res.json();
  const entryData = data[0];
  const senses = [], synSet = new Set(), antSet = new Set();
  (entryData.meanings||[]).forEach(m=>{
    const defObj = (m.definitions && m.definitions[0]) || {};
    senses.push({
      pronunciation: entryData.phonetic || (entryData.phonetics&&entryData.phonetics.find(p=>p.text)?.text) || '',
      partOfSpeech: m.partOfSpeech || '',
      definitionEN: defObj.definition || '',
      definitionVI: '',
      examples: defObj.example ? [defObj.example] : []
    });
    (m.synonyms||[]).forEach(s=>synSet.add(s));
    (m.antonyms||[]).forEach(a=>antSet.add(a));
    (m.definitions||[]).forEach(d=>{
      (d.synonyms||[]).forEach(s=>synSet.add(s));
      (d.antonyms||[]).forEach(a=>antSet.add(a));
    });
  });
  if(senses.length===0) senses.push({pronunciation:entryData.phonetic||'',partOfSpeech:'',definitionEN:'',definitionVI:'',examples:[]});
  return { senses, synonyms:Array.from(synSet).slice(0,8), antonyms:Array.from(antSet).slice(0,8) };
}

function startGame(type){
  const pool = state.entries.filter(e=>e.senses && e.senses.some(s=>s.definitionVI));
  if(type==='synonym'||type==='antonym'){
    const key = type==='synonym'?'synonyms':'antonyms';
    const eligible = pool.filter(e=>(e[key]||[]).length>0);
    if(eligible.length<1 || pool.length<4){ showNotEnough(type==='synonym'?'từ đồng nghĩa':'từ trái nghĩa', 4); return; }
    session = { type, queue:shuffle(eligible), idx:0, correct:0, total:0, key };
    nextChoice();
    return;
  }
  if(pool.length<1){ showNotEnough('nghĩa tiếng Việt', 1); return; }
  if(type==='flashcard'){
    session = { type, queue:shuffle(pool), idx:0, correct:0, total:0, revealed:false };
    renderFlashcard();
  } else if(type==='translate'){
    session = { type, queue:shuffle(pool), idx:0, correct:0, total:0, dir:'vi2en', hints:0 };
    renderTranslate();
  }
}

function answerFlashcard(entry, known){

/* ---- Translate with hint ---- */
function renderTranslate(){
  const s = session;
  if(s.idx>=s.queue.length){ app.innerHTML = gameShell('Dịch nghĩa') + summaryPanel(); bindExit(); bindReplay('translate'); return; }
  const entry = s.queue[s.idx];
  const sense = entry.senses.find(x=>x.definitionVI) || entry.senses[0];
  const dir = s.dir;
  const target = dir==='vi2en' ? entry.word : sense.definitionVI;
  const masked = maskText(target, s.hints);
  const allRevealed = s.hints >= countAlpha(target);
  const dirLabel = dir==='vi2en' ? 'Việt → Anh' : 'Anh → Việt';

  const promptHtml = dir==='vi2en'
    ? `<div class="prompt-card">
         <span class="pos-chip">${escapeHtml(sense.partOfSpeech||'')}</span>
         <div class="p-vi" style="margin-top:8px;">${escapeHtml(sense.definitionVI)}</div>
         <div class="p-en" style="margin-top:4px;">${escapeHtml(sense.definitionEN||'')}</div>
       </div>`
    : `<div class="prompt-card">
         <div style="display:flex;align-items:center;justify-content:center;gap:10px;">
           <span style="font-size:26px;font-weight:800;">${escapeHtml(entry.word)}</span>
           <button class="speak-btn" data-speak="${escapeHtml(entry.word)}">🔈</button>
         </div>
         ${sense.pronunciation?`<div class="muted" style="font-size:13px;">${escapeHtml(sense.pronunciation)}</div>`:''}
         <span class="pos-chip">${escapeHtml(sense.partOfSpeech||'')}</span>
       </div>`;

  app.innerHTML = gameShell('Dịch nghĩa ('+dirLabel+')', 'Nhìn nghĩa + loại từ, đoán từ. Dùng 💡 để lộ dần kí tự.') + `
    <div class="panel">
      ${promptHtml}
      <div style="text-align:center;margin:16px 0 4px;">
        <small class="muted" style="font-size:12px;">${dir==='vi2en' ? 'Từ tiếng Anh là:' : 'Nghĩa tiếng Việt là:'}</small>
        <div class="guess-word" style="margin-top:6px;">${masked.split('').map(c=>c==='_'?'<span style="color:#c2cad4;">_</span>':escapeHtml(c)).join('')}</div>
      </div>
      <label>${dir==='vi2en' ? 'Gõ từ tiếng Anh:' : 'Gõ nghĩa tiếng Việt:'}</label>
      <input type="text" id="answerInput" autocomplete="off" placeholder="${dir==='vi2en' ? 'approve' : 'đồng ý, chấp thuận…'}">
      <div class="row" style="margin-top:12px;">
        <button class="btn ghost sm" id="hintBtn" ${allRevealed?'disabled':''}>💡 Gợi ý (${s.hints}/${countAlpha(target)})</button>
        <button class="btn" id="submitAnswerBtn" style="flex:1;">Kiểm tra</button>
      </div>
      <div id="feedbackArea"></div>
    </div>`;
  bindExit();
  const input = $('#answerInput');
  input.value = s.tempAnswer || '';
  input.focus();
  $('#hintBtn').onclick = ()=>{
    if(s.hints < countAlpha(target)){
      s.tempAnswer = input.value;
      s.hints++;
      renderTranslate();
    }
  };
  const submit = ()=>{
    const userAns = input.value;
    const answers = dir==='vi2en' ? [entry.word] : entry.senses.map(x=>x.definitionVI);
    const isCorrect = answers.some(a=> normalize(userAns) === normalize(a));
    input.disabled = true;
    $('#submitAnswerBtn').disabled = true;
    $('#hintBtn').disabled = true;
    registerResult(entry, isCorrect);
    recordHistory('translate', entry.id, isCorrect);
    session.total++; if(isCorrect) session.correct++;
    $('#feedbackArea').innerHTML = `
      <div class="feedback ${isCorrect?'ok':'no'}">${isCorrect ? '✓ Chính xác! 🎉' : '✗ Chưa đúng.'}</div>
      ${resultCard(entry, sense)}
      <div class="row" style="margin-top:12px;">
        <button class="btn" id="nextQBtn" style="flex:1;">Câu tiếp →</button>
      </div>`;
    $('#nextQBtn').onclick = ()=>{
      session.idx++;
      session.dir = Math.random()<0.5?'vi2en':'en2vi';
      session.hints = 0;
      session.tempAnswer = '';
      renderTranslate();
    };
    const sp = $('#feedbackArea').querySelector('[data-speak]');
    if(sp) sp.onclick = ()=> speak(sp.dataset.speak);
  };
  $('#submitAnswerBtn').onclick = submit;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  const sp = $('[data-speak]');
  if(sp) sp.onclick = ()=> speak(sp.dataset.speak);
}
function countAlpha(str){ return [...String(str||'')].filter(c=>/[a-zA-ZÀ-ỹđ]/.test(c)).length; }
function maskText(str, n){
  let seen = 0;
  return [...String(str||'')].map(ch=>{
    if(/[a-zA-ZÀ-ỹđ]/.test(ch)){ seen++; return seen<=n ? ch : '_'; }
    return ch;
  }).join('');
}

/* ---- Synonym / Antonym ---- */
function nextChoice(){
  const s = session;
  if(s.idx>=s.queue.length){ renderChoiceDone(); return; }
  const entry = s.queue[s.idx];
  const correctWord = shuffle(entry[s.key])[0];
  const entryPos = (entry.senses&&entry.senses[0]&&entry.senses[0].partOfSpeech)||'';
  const others = state.entries.filter(e=> e.word.toLowerCase()!==entry.word.toLowerCase() && e.word.toLowerCase()!==correctWord.toLowerCase());
  let distractorPool = others.filter(e=>(e.senses&&e.senses[0]&&e.senses[0].partOfSpeech)===entryPos);
  if(distractorPool.length<3) distractorPool = others;
  const distractorWords = shuffle(Array.from(new Set(distractorPool.map(e=>e.word)))).slice(0,3);
  const options = shuffle([correctWord, ...distractorWords]);
  s.current = { entry, correctWord, options };
  renderChoice();
}
function renderChoice(){
  const s = session;
  const title = s.type==='synonym' ? 'Chọn từ đồng nghĩa' : 'Chọn từ trái nghĩa';
  const { entry, options } = s.current;
  app.innerHTML = gameShell(title, 'Từ nào '+(s.type==='synonym'?'đồng nghĩa':'trái nghĩa')+' với từ bên dưới?') + `
    <div class="panel">
      <div style="text-align:center;padding:8px 0 18px;">
        <div style="font-size:26px;font-weight:800;">${escapeHtml(entry.word)}</div>
        ${(entry.senses&&entry.senses[0]&&entry.senses[0].pronunciation)?`<div class="muted" style="font-size:13px;">${escapeHtml(entry.senses[0].pronunciation)}</div>`:''}
        ${posChips(entry)}
      </div>
      <div id="choicesArea">
        ${options.map(o=>`<button class="choice-btn" data-word="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}
      </div>
      <div id="feedbackArea"></div>
    </div>`;
  bindExit();
  document.querySelectorAll('.choice-btn').forEach(btn=> btn.onclick = ()=> answerChoice(btn.dataset.word));
}
function answerChoice(chosen){
  const s = session;
  const { entry, correctWord } = s.current;
  const isCorrect = normalize(chosen) === normalize(correctWord);
  document.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.disabled = true;
    if(normalize(btn.dataset.word)===normalize(correctWord)) btn.classList.add('correct');
    else if(btn.dataset.word===chosen) btn.classList.add('wrong');
  });
  registerResult(entry, isCorrect);
  recordHistory(s.type, entry.id, isCorrect);
  s.total++; if(isCorrect) s.correct++;
  $('#feedbackArea').innerHTML = `
    <div class="feedback ${isCorrect?'ok':'no'}">
      ${isCorrect ? '✓ Chính xác!' : `✗ Chưa đúng. Đáp án: <b>${escapeHtml(correctWord)}</b>`}
    </div>
    <div class="row" style="margin-top:12px;"><button class="btn" id="nextQBtn" style="flex:1;">Câu tiếp →</button></div>`;
  $('#nextQBtn').onclick = ()=>{ s.idx++; nextChoice(); };
}
function renderChoiceDone(){
  const title = session.type==='synonym' ? 'Chọn từ đồng nghĩa' : 'Chọn từ trái nghĩa';
  app.innerHTML = gameShell(title) + summaryPanel();
  bindExit(); bindReplay(session.type);

function summaryPanel(){
  const s = session;
  const pct = s.total ? Math.round((s.correct/s.total)*100) : 0;
  return `
    <div class="panel" style="text-align:center;">
      <h2>Hoàn thành! 🎉</h2>
      <div class="stat-grid" style="max-width:360px;margin:14px auto;">
        <div class="stat-box"><div class="num">${s.total}</div><div class="lbl">Số câu</div></div>
        <div class="stat-box"><div class="num">${s.correct}</div><div class="lbl">Đúng</div></div>
        <div class="stat-box"><div class="num" style="color:var(--primary);">${pct}%</div><div class="lbl">Tỷ lệ</div></div>
      </div>
      <div class="row" style="max-width:360px;margin:0 auto;">
        <button class="btn ghost" id="backToMenuBtn2">← Menu</button>
        <button class="btn" id="replayBtn">Chơi lại</button>
      </div>
    </div>`;
}
function bindReplay(type){
  const back = $('#backToMenuBtn2');
  if(back) back.onclick = ()=>{ state.gameScreen='menu'; session=null; renderGamesTab(); };
  const replay = $('#replayBtn');
  if(replay) replay.onclick = ()=> startGame(type);
}

/* ==================== STATS TAB ==================== */
function renderStatsTab(){
  const entries = state.entries;
  const total = entries.length;
  const counts = { new:0, learning:0, mastered:0 };
  entries.forEach(e=> counts[e.learningStatus] = (counts[e.learningStatus]||0)+1);

  const history = loadHistory();
  const byGame = {};
  history.forEach(h=>{
    byGame[h.game] = byGame[h.game] || { correct:0, total:0 };
    byGame[h.game].total++;
    if(h.correct) byGame[h.game].correct++;
  });
  const gameNames = { flashcard:'Flashcard', translate:'Dịch nghĩa', synonym:'Đồng nghĩa', antonym:'Trái nghĩa' };

  const daily = loadDaily();
  const last14 = [];
  const cursor = new Date(todayStr());
  for(let i=0;i<14;i++){ last14.unshift({ date:fmtDate(cursor), n:(daily[fmtDate(cursor)]||[]).length }); cursor.setDate(cursor.getDate()-1); }
  const maxDaily = Math.max(1, ...last14.map(d=>d.n));
  const totalLearnedAll = Object.values(daily).reduce((a,b)=>a+b.length,0);
  const pctNew = total ? Math.round(counts.new/total*100) : 0;
  const pctLearning = total ? Math.round(counts.learning/total*100) : 0;
  const pctMastered = total ? Math.round(counts.mastered/total*100) : 0;

  app.innerHTML = `
    <div class="panel">
      <h2>Tổng quan</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${total}</div><div class="lbl">Tổng từ</div></div>
        <div class="stat-box"><div class="num" style="color:var(--new);">${counts.new||0}</div><div class="lbl">Mới</div></div>
        <div class="stat-box"><div class="num" style="color:var(--learning);">${counts.learning||0}</div><div class="lbl">Đang học</div></div>
        <div class="stat-box"><div class="num" style="color:var(--mastered);">${counts.mastered||0}</div><div class="lbl">Đã thuộc</div></div>
        <div class="stat-box"><div class="num" style="color:var(--amber);">${getStreak()}</div><div class="lbl">Streak 🔥</div></div>
        <div class="stat-box"><div class="num" style="color:var(--primary);">${totalLearnedAll}</div><div class="lbl">Lượt đã học</div></div>
      </div>
      <div class="status-stack">
        <div style="width:${pctNew}%;background:var(--new);"></div>
        <div style="width:${pctLearning}%;background:var(--learning);"></div>
        <div style="width:${pctMastered}%;background:var(--mastered);"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--new);"></i>Mới ${pctNew}%</span>
        <span><i style="background:var(--learning);"></i>Đang học ${pctLearning}%</span>
        <span><i style="background:var(--mastered);"></i>Đã thuộc ${pctMastered}%</span>
      </div>
    </div>

    <div class="panel">
      <h2>Từ học mỗi ngày (14 ngày gần nhất)</h2>
      ${totalLearnedAll===0 ? `<div class="empty-state">Chưa có dữ liệu. Vào tab "Hôm nay" để học từ đầu tiên!</div>` :
        last14.map(d=>`
          <div class="bar-row">
            <span class="lbl">${d.date.slice(5)}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${(d.n/maxDaily*100)}%;background:${d.n>0?'var(--primary)':'#e8ebf0'};"></div></div>
            <span class="val">${d.n}</span>
          </div>`).join('')}
    </div>

    <div class="panel">
      <h2>Tỷ lệ đúng theo trò chơi</h2>
      ${Object.keys(byGame).length===0 ? `<div class="empty-state">Chưa có dữ liệu chơi game.</div>` :
        Object.entries(byGame).map(([g,v])=>{
          const p = v.total ? Math.round(v.correct/v.total*100) : 0;
          return `
            <div class="bar-row">
              <span class="lbl">${gameNames[g]||g}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${p>=80?'var(--mastered)':p>=50?'var(--learning)':'var(--danger)'};"></div></div>
              <span class="val">${p}%</span>
            </div>
            <div style="font-size:11px;color:var(--muted);margin:-3px 0 8px 98px;">${v.correct}/${v.total} câu đúng</div>`;
        }).join('')}
    </div>
  `;
}

function buildSeedEntries(){
  const now = new Date().toISOString();
  const list = SEED_WORDS.map(([word, ipa, pos, defEN, defVI, example, tag, syn, ant, root])=>({
    id: uid(), word, tags:[tag], dateAdded: now, learningStatus:'new', correctStreak:0,
    synonyms: syn||[], antonyms: ant||[], wordRoot: root||'',
    senses:[{ pronunciation: ipa, partOfSpeech: pos, definitionEN: defEN, definitionVI: defVI, examples:[example] }]
  }));
  list.push({ id: uid(), dateAdded: now, learningStatus:'new', correctStreak:0, ...RECORD_ENTRY });
  return list;
}

/* ==================== INIT / MIGRATION ==================== */
function init(){
  // migrate old v1 data into v2 storage if present
  if(state.entries.length === 0){
    try{
      const old = localStorage.getItem('vocab_entries_v1');
      if(old){
        const parsed = JSON.parse(old);
        if(Array.isArray(parsed) && parsed.length){
          state.entries = parsed.map(e=>({ wordRoot:'', ...e, learningStatus: e.learningStatus||'new' }));
          saveEntries(state.entries);
        }
      }
    }catch(e){ /* ignore */ }
  }
  // merge built-in seed words that are not yet in the bank (never overwrite user data)
  const existing = new Set(state.entries.map(e=> e.word.toLowerCase()));
  let added = 0;
  const now = new Date().toISOString();
  SEED_WORDS.forEach(([word, ipa, pos, defEN, defVI, example, tag, syn, ant, root])=>{
    if(existing.has(word.toLowerCase())) return;
    state.entries.push({
      id: uid(), word, tags:[tag], dateAdded: now, learningStatus:'new', correctStreak:0,
      synonyms: syn||[], antonyms: ant||[], wordRoot: root||'',
      senses:[{ pronunciation: ipa, partOfSpeech: pos, definitionEN: defEN, definitionVI: defVI, examples:[example] }]
    });
    added++;
  });
  if(!existing.has('record')) state.entries.push({ id: uid(), dateAdded: now, learningStatus:'new', correctStreak:0, ...RECORD_ENTRY, tags:['học thuật','công nghệ'] });
  if(added>0 || state.entries.length>0) saveEntries(state.entries);
}

init();
render();


</script>
